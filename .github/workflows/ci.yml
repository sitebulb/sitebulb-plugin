name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.311
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scorer test suite
        run: python3 shared/scripts/test_score_effort.py

      - name: Document builder test suite
        run: python3 shared/skills/sitebulb-technical-seo-audit/scripts/test_build_docx.py

      - name: Shared files in sync
        run: python3 scripts/sync_shared.py --check

      - name: Manifests are valid JSON
        run: |
          set -e
          for f in $(git ls-files '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Each plugin declares its one MCP server and is listed everywhere
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          URLS = {
              "sitebulb-desktop": "https://desktop.mcp.sitebulb.com/mcp",
              "sitebulb-cloud": "https://cloud.mcp.sitebulb.com/mcp",
          }
          MANIFESTS = [".claude-plugin", ".codex-plugin", ".cursor-plugin"]
          load = lambda p: json.loads(Path(p).read_text(encoding="utf-8"))
          bad = []

          folders = sorted(p.name for p in Path("plugins").iterdir() if p.is_dir())
          if folders != sorted(URLS):
              bad.append(f"plugins/ holds {folders}, expected {sorted(URLS)}")

          for name, url in URLS.items():
              root = Path("plugins") / name
              servers = load(root / ".mcp.json").get("mcpServers", {})
              if len(servers) != 1:
                  bad.append(f"{name}: .mcp.json declares {len(servers)} servers, expected 1")
              for key, server in servers.items():
                  if server.get("type") != "http" or server.get("url") != url:
                      bad.append(f"{name}: server {key} is not type http at {url}")
                  if server.get("headers") or "clientSecret" in json.dumps(server):
                      bad.append(f"{name}: server {key} has headers or a clientSecret")
              versions = set()
              for m in MANIFESTS:
                  data = load(root / m / "plugin.json")
                  versions.add(data.get("version"))
                  if data.get("name") != name:
                      bad.append(f"{name}: {m}/plugin.json name is {data.get('name')!r}")
                  if m != ".claude-plugin" and data.get("mcpServers") != "./.mcp.json":
                      bad.append(f"{name}: {m}/plugin.json mcpServers is not ./.mcp.json")
              if len(versions) != 1:
                  bad.append(f"{name}: manifest versions differ: {sorted(map(str, versions))}")

          for path in [".claude-plugin/marketplace.json", ".cursor-plugin/marketplace.json",
                       ".agents/plugins/marketplace.json"]:
              listed = sorted(p["name"] for p in load(path)["plugins"])
              if listed != sorted(URLS):
                  bad.append(f"{path} lists {listed}, expected {sorted(URLS)}")

          if bad:
              print("Plugin manifest problems:", *bad, sep="\n  ")
              sys.exit(1)
          print("Both plugins declare one MCP server and every marketplace lists both.")
          PY

      - name: claude plugin validate
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          set -e
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" \
            "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude="$RUNNER_TEMP/claude-code/node_modules/.bin/claude"
          "$claude" --version
          "$claude" plugin validate --strict .
          for plugin in plugins/*/; do
            "$claude" plugin validate --profile directory --strict "$plugin"
          done

      - name: Only approved MCP endpoints referenced
        run: |
          # Every Sitebulb MCP address must be one of the two plugin servers or
          # the two custom-connector servers. Each address is checked on its
          # own, so an approved address cannot hide another one on the same line.
          # The search ignores case, because a host name is case-insensitive,
          # but the allow-list is not: an address must be written exactly as
          # below, in lower case. A port, query, fragment or non-ASCII character
          # stays part of the address, so it also fails the allow-list. Dots and
          # colons at the end of an address are prose punctuation and are removed.
          refs=$(LC_ALL=C grep -rIoniE --exclude-dir=.git \
            '[a-z0-9.-]*mcp\.sitebulb\.com([a-z0-9/._~%?#=&:@+-]|[^[:print:][:space:]])*' . \
            || true)
          bad=$(printf '%s\n' "$refs" | LC_ALL=C sed -E 's/[.:]+$//' | grep -v '^$' \
            | grep -vE ':((desktop|cloud)\.mcp\.sitebulb\.com/mcp|mcp\.sitebulb\.com/(desktop|cloud))$' \
            || true)
          if [ -n "$bad" ]; then
            echo "Disallowed MCP address (only desktop.mcp.sitebulb.com/mcp, cloud.mcp.sitebulb.com/mcp,"
            echo "mcp.sitebulb.com/desktop and mcp.sitebulb.com/cloud are public):"
            echo "$bad"
            exit 1
          fi

      - name: Skill names are namespaced
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          NAMES = ["what-to-fix-first", "what-changed", "dev-handoff",
                   "technical-seo-audit", "release-check"]
          # This file and the changelog history keep the pre-rename names on purpose.
          SKIP = {"CHANGELOG.md", ".github/workflows/ci.yml"}
          pattern = re.compile(r"(?<!sitebulb-)\b(" + "|".join(NAMES) + r")\b")

          files = subprocess.run(["git", "ls-files"], capture_output=True,
                                 text=True, check=True).stdout.split()
          bad = []
          for rel in files:
              if rel in SKIP:
                  continue
              if pattern.search(rel):
                  bad.append(f"{rel}: path is not namespaced")
                  continue
              try:
                  text = open(rel, encoding="utf-8").read()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      bad.append(f"{rel}:{n}: {line.strip()[:120]}")
          if bad:
              print("Un-namespaced skill reference found "
                    "(every skill name is prefixed with sitebulb-):")
              print("\n".join(bad))
              sys.exit(1)
          PY
