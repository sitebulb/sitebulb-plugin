name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scorer test suite
        run: python3 shared/scripts/test_score_effort.py

      - name: Document builder test suite
        run: python3 plugins/sitebulb/skills/sitebulb-technical-seo-audit/scripts/test_build_docx.py

      - name: Shared files in sync
        run: python3 scripts/sync_shared.py --check

      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool .cursor-plugin/marketplace.json > /dev/null
          python3 -m json.tool .agents/plugins/marketplace.json > /dev/null
          python3 -m json.tool plugins/sitebulb/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/sitebulb/.codex-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/sitebulb/.cursor-plugin/plugin.json > /dev/null

      - name: Only approved MCP endpoints referenced
        run: |
          bad=$(grep -rIn 'mcp\.sitebulb\.com' --exclude-dir=.git . \
            | grep -vE 'mcp\.sitebulb\.com/(desktop|cloud)([^a-z]|$)' || true)
          if [ -n "$bad" ]; then
            echo "Disallowed MCP gateway reference (only the /desktop and /cloud endpoints are public):"
            echo "$bad"
            exit 1
          fi

      - name: Skill names are namespaced
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          NAMES = ["what-to-fix-first", "what-changed", "dev-handoff",
                   "technical-seo-audit", "release-check"]
          # This file and the changelog history keep the pre-rename names on purpose.
          SKIP = {"CHANGELOG.md", ".github/workflows/ci.yml"}
          pattern = re.compile(r"(?<!sitebulb-)\b(" + "|".join(NAMES) + r")\b")

          files = subprocess.run(["git", "ls-files"], capture_output=True,
                                 text=True, check=True).stdout.split()
          bad = []
          for rel in files:
              if rel in SKIP:
                  continue
              if pattern.search(rel):
                  bad.append(f"{rel}: path is not namespaced")
                  continue
              try:
                  text = open(rel, encoding="utf-8").read()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      bad.append(f"{rel}:{n}: {line.strip()[:120]}")
          if bad:
              print("Un-namespaced skill reference found "
                    "(every skill name is prefixed with sitebulb-):")
              print("\n".join(bad))
              sys.exit(1)
          PY
