name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Each change adds a change fragment
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CHANGE_BASE" ] && [ "$CHANGE_BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/changes.py check --base "$CHANGE_BASE"
          else
            python3 scripts/changes.py check
          fi

  validate:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.311
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Release script test suite
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" python3 scripts/test_release.py

      - name: Change fragment test suite
        run: python3 scripts/test_changes.py

      - name: Scorer test suite
        run: python3 shared/scripts/test_score_effort.py

      - name: Document builder test suite
        run: python3 shared/skills/sitebulb-technical-seo-audit/scripts/test_build_docx.py

      - name: Shared files in sync
        run: python3 scripts/sync_shared.py --check

      - name: Manifests are valid JSON
        run: |
          set -e
          for f in $(git ls-files '*.json'); do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Every version field holds the same version
        run: python3 scripts/release.py versions

      - name: Each plugin declares its one MCP server and is listed everywhere
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from release import MANIFESTS

          URLS = {
              "sitebulb-desktop": "https://desktop.mcp.sitebulb.com/mcp",
              "sitebulb-cloud": "https://cloud.mcp.sitebulb.com/mcp",
          }
          load = lambda p: json.loads(Path(p).read_text(encoding="utf-8"))
          bad = []

          folders = sorted(p.name for p in Path("plugins").iterdir() if p.is_dir())
          if folders != sorted(URLS):
              bad.append(f"plugins/ holds {folders}, expected {sorted(URLS)}")

          for name, url in URLS.items():
              root = Path("plugins") / name
              servers = load(root / ".mcp.json").get("mcpServers", {})
              if len(servers) != 1:
                  bad.append(f"{name}: .mcp.json declares {len(servers)} servers, expected 1")
              for key, server in servers.items():
                  if server.get("type") != "http" or server.get("url") != url:
                      bad.append(f"{name}: server {key} is not type http at {url}")
                  if server.get("headers") or "clientSecret" in json.dumps(server):
                      bad.append(f"{name}: server {key} has headers or a clientSecret")
              for m in MANIFESTS:
                  data = load(root / m / "plugin.json")
                  if data.get("name") != name:
                      bad.append(f"{name}: {m}/plugin.json name is {data.get('name')!r}")
                  if m != ".claude-plugin" and data.get("mcpServers") != "./.mcp.json":
                      bad.append(f"{name}: {m}/plugin.json mcpServers is not ./.mcp.json")

          for path in [".claude-plugin/marketplace.json", ".cursor-plugin/marketplace.json",
                       ".agents/plugins/marketplace.json"]:
              listed = sorted(p["name"] for p in load(path)["plugins"])
              if listed != sorted(URLS):
                  bad.append(f"{path} lists {listed}, expected {sorted(URLS)}")

          if bad:
              print("Plugin manifest problems:", *bad, sep="\n  ")
              sys.exit(1)
          print("Both plugins declare one MCP server and every marketplace lists both.")
          PY

      - name: OpenAI listing and review metadata meet the submission rules
        run: |
          # Rules from https://developers.openai.com/plugins/deploy/submission
          # and /plugins/deploy/submission-errors (final directory submission).
          python3 - <<'PY'
          import json, struct, sys
          from pathlib import Path
          from urllib.parse import urlsplit

          CATEGORIES = {"Productivity", "Creativity", "Developer Tools", "Business & Operations",
                        "Data & Analytics", "Communication", "Education & Research", "Security",
                        "Finance", "Healthcare", "Travel", "Entertainment", "Other"}
          URL_FIELDS = ["websiteURL", "supportURL", "privacyPolicyURL", "termsOfServiceURL"]
          POSITIVE = ["description", "prompt", "tools_triggered", "expected_behavior"]
          DEMO_PLACEHOLDER = "TODO: unlisted video URL"
          load = lambda p: json.loads(Path(p).read_text(encoding="utf-8"))
          bad = []

          def text(name, field, value, limit, one_line=True):
              if not isinstance(value, str) or not value.strip():
                  bad.append(f"{name}: {field} is empty")
              elif len(value) > limit:
                  bad.append(f"{name}: {field} is {len(value)} characters, the maximum is {limit}")
              elif one_line and "\n" in value:
                  bad.append(f"{name}: {field} must be one line")

          def square_png(name, root, field, rel):
              path = root / str(rel)
              head = path.read_bytes()[:24] if path.is_file() else b""
              if not str(rel).startswith("./") or head[:8] != b"\x89PNG\r\n\x1a\n":
                  bad.append(f"{name}: {field} {rel} is not a ./ path to a PNG file")
                  return
              width, height = struct.unpack(">II", head[16:24])
              if width != height or not 48 <= width <= 4096:
                  bad.append(f"{name}: {field} is {width}x{height}, it must be square, 48 to 4096 px")

          market = {p["name"]: p for p in load(".agents/plugins/marketplace.json")["plugins"]}
          for root in sorted(p for p in Path("plugins").iterdir() if p.is_dir()):
              name = root.name
              # A root plugin.json with extensions.com.openai replaces the Codex
              # manifest's OpenAI settings, and a root mcp.json is a second MCP
              # declaration. This repository uses the Codex format only.
              for portable in ("plugin.json", "mcp.json"):
                  if (root / portable).exists():
                      bad.append(f"{name}: {portable} at the plugin root; use .codex-plugin/ and .mcp.json")
              codex = load(root / ".codex-plugin" / "plugin.json")
              ui = codex.get("interface", {})
              text(name, "displayName", ui.get("displayName"), 30)
              text(name, "shortDescription", ui.get("shortDescription"), 30)
              text(name, "longDescription", ui.get("longDescription"), 4000, one_line=False)
              text(name, "developerName", ui.get("developerName"), 80)
              if ui.get("category") not in CATEGORIES:
                  bad.append(f"{name}: category {ui.get('category')!r} is not an OpenAI category")
              if market.get(name, {}).get("category") != ui.get("category"):
                  bad.append(f"{name}: .agents/plugins/marketplace.json category differs from interface.category")
              # Every Sitebulb MCP tool sets ReadOnly = true and the plugin has no UI.
              if ui.get("capabilities") != ["Read"]:
                  bad.append(f"{name}: capabilities is {ui.get('capabilities')}, expected ['Read']")
              for field in URL_FIELDS:
                  url = ui.get(field)
                  parts = urlsplit(url) if isinstance(url, str) else None
                  host = (parts.hostname or "") if parts else ""
                  if (not parts or parts.scheme != "https" or parts.username or parts.password
                          or len(url) > 1024
                          or not (host == "sitebulb.com" or host.endswith(".sitebulb.com"))):
                      bad.append(f"{name}: {field} {url!r} is not an HTTPS page on a Sitebulb domain")
              prompts = ui.get("defaultPrompt", [])
              if (len(prompts) > 3 or len(set(prompts)) != len(prompts)
                      or any(not p.strip() or len(p) > 128 or "@" in p for p in prompts)):
                  bad.append(f"{name}: defaultPrompt must be at most 3 unique prompts of 128 characters or fewer")
              for field in ("logo", "composerIcon"):
                  square_png(name, root, field, ui.get(field))

              openai = codex.get("extensions", {}).get("com.openai", {})
              review = openai.get("review", {})
              cases = review.get("test_cases", {})
              positive, negative = cases.get("positive", []), cases.get("negative", [])
              if len(positive) != 5 or len(negative) != 3:
                  bad.append(f"{name}: {len(positive)} positive and {len(negative)} negative test cases, expected 5 and 3")
              for n, case in enumerate(positive, 1):
                  for key in POSITIVE:
                      if not str(case.get(key, "")).strip():
                          bad.append(f"{name}: positive case {n} has no {key}")
              for n, case in enumerate(negative, 1):
                  for key in ("description", "prompt"):
                      if not str(case.get(key, "")).strip():
                          bad.append(f"{name}: negative case {n} has no {key}")
              for key in ("test_credentials", "reviewer_instructions"):
                  if key in json.dumps(codex):
                      bad.append(f"{name}: the manifest holds {key}; OpenAI rejects it in the ZIP")
              # Optional in the ZIP, required for MCP review. Accept an https:// URL,
              # or the placeholder with a warning until the video exists. The
              # release ZIP check (scripts/check_zip.py) refuses the placeholder.
              demo = review.get("demo_recording_url")
              if demo == DEMO_PLACEHOLDER:
                  print(f"warning: {name}: demo_recording_url is the placeholder "
                        f"{DEMO_PLACEHOLDER!r}; replace it with the video URL before Submit for review")
              elif not (isinstance(demo, str) and urlsplit(demo).scheme == "https"
                        and urlsplit(demo).hostname and " " not in demo):
                  bad.append(f"{name}: demo_recording_url {demo!r} is not an https:// URL "
                             f"or the placeholder {DEMO_PLACEHOLDER!r}")
              notes = openai.get("publication", {}).get("release_notes", "")
              if not notes.startswith(f"{codex.get('version')}:"):
                  bad.append(f"{name}: release_notes does not start with '{codex.get('version')}:'")

              claude = load(root / ".claude-plugin" / "plugin.json")
              if claude.get("privacyPolicyUrl") != ui.get("privacyPolicyURL"):
                  bad.append(f"{name}: .claude-plugin privacyPolicyUrl differs from the Codex privacyPolicyURL")

          if bad:
              print("OpenAI listing problems:", *bad, sep="\n  ")
              sys.exit(1)
          print("Both plugins meet the OpenAI listing and review rules.")
          PY

      - name: Anthropic connector listing text meets the submission rules
        run: |
          # Limits from https://claude.com/docs/connectors/building/submission
          # (Listing step): name 100, one-liner 200, description 2,000 characters.
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          LIMITS = {"Name": 100, "One-liner": 200, "Description": 2000}
          load = lambda p: json.loads(Path(p).read_text(encoding="utf-8"))
          bad = []
          for root in sorted(p for p in Path("plugins").iterdir() if p.is_dir()):
              name, path = root.name, root / "LISTING.md"
              if not path.is_file():
                  bad.append(f"{name}: LISTING.md is missing")
                  continue
              text = path.read_text(encoding="utf-8")
              sections = dict(re.findall(r"^## (.+?)\n(.*?)(?=^## |\Z)", text, re.S | re.M))
              for section, limit in LIMITS.items():
                  body = sections.get(section, "").strip()
                  if not body:
                      bad.append(f"{name}: LISTING.md has no {section} text")
                  elif len(body) > limit:
                      bad.append(f"{name}: LISTING.md {section} is {len(body)} characters, the maximum is {limit}")
              rows = dict(re.findall(r"^\| (.+?) \| (.+?) \|$", text, re.M))
              server = next(iter(load(root / ".mcp.json")["mcpServers"].values()))["url"]
              codex = load(root / ".codex-plugin" / "plugin.json")["interface"]
              expected = {
                  "Server URL": server,
                  "Privacy policy URL": codex["privacyPolicyURL"],
                  "Icon": codex["logo"].removeprefix("./"),
              }
              for field, value in expected.items():
                  if rows.get(field) != value:
                      bad.append(f"{name}: LISTING.md {field} is {rows.get(field)!r}, expected {value!r}")
              if not (root / rows.get("Icon", "-")).is_file():
                  bad.append(f"{name}: LISTING.md Icon is not a file in the plugin")
              doc = rows.get("Documentation URL", "")
              if not re.fullmatch(r"https://([a-z0-9-]+\.)*sitebulb\.com/\S*", doc):
                  bad.append(f"{name}: LISTING.md Documentation URL {doc!r} is not HTTPS on a Sitebulb domain")
              if not rows.get("Support contact", "").strip():
                  bad.append(f"{name}: LISTING.md has no Support contact")
              if sections.get("Name", "").strip() != codex["displayName"]:
                  bad.append(f"{name}: LISTING.md Name differs from interface.displayName")
          if bad:
              print("Anthropic listing problems:", *bad, sep="\n  ")
              sys.exit(1)
          print("Both LISTING.md files meet the Anthropic listing limits.")
          PY

      - name: claude plugin validate
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          set -e
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/claude-code" \
            "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude="$RUNNER_TEMP/claude-code/node_modules/.bin/claude"
          "$claude" --version
          "$claude" plugin validate --strict .
          for plugin in plugins/*/; do
            "$claude" plugin validate --profile directory --strict "$plugin"
          done

      - name: Only approved MCP endpoints referenced
        run: |
          # Every Sitebulb MCP address must be one of the two plugin servers or
          # the two custom-connector servers. Each address is checked on its
          # own, so an approved address cannot hide another one on the same line.
          # The search ignores case, because a host name is case-insensitive,
          # but the allow-list is not: an address must be written exactly as
          # below, in lower case. A port, query, fragment or non-ASCII character
          # stays part of the address, so it also fails the allow-list. Dots and
          # colons at the end of an address are prose punctuation and are removed.
          refs=$(LC_ALL=C grep -rIoniE --exclude-dir=.git \
            '[a-z0-9.-]*mcp\.sitebulb\.com([a-z0-9/._~%?#=&:@+-]|[^[:print:][:space:]])*' . \
            || true)
          bad=$(printf '%s\n' "$refs" | LC_ALL=C sed -E 's/[.:]+$//' | grep -v '^$' \
            | grep -vE ':((desktop|cloud)\.mcp\.sitebulb\.com/mcp|mcp\.sitebulb\.com/(desktop|cloud))$' \
            || true)
          if [ -n "$bad" ]; then
            echo "Disallowed MCP address (only desktop.mcp.sitebulb.com/mcp, cloud.mcp.sitebulb.com/mcp,"
            echo "mcp.sitebulb.com/desktop and mcp.sitebulb.com/cloud are public):"
            echo "$bad"
            exit 1
          fi

      - name: Skill names are namespaced
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          NAMES = ["what-to-fix-first", "what-changed", "dev-handoff",
                   "technical-seo-audit", "release-check"]
          # This file and the changelog history keep the pre-rename names on purpose.
          SKIP = {"CHANGELOG.md", ".github/workflows/ci.yml"}
          pattern = re.compile(r"(?<!sitebulb-)\b(" + "|".join(NAMES) + r")\b")

          files = subprocess.run(["git", "ls-files"], capture_output=True,
                                 text=True, check=True).stdout.split()
          bad = []
          for rel in files:
              if rel in SKIP:
                  continue
              if pattern.search(rel):
                  bad.append(f"{rel}: path is not namespaced")
                  continue
              try:
                  text = open(rel, encoding="utf-8").read()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      bad.append(f"{rel}:{n}: {line.strip()[:120]}")
          if bad:
              print("Un-namespaced skill reference found "
                    "(every skill name is prefixed with sitebulb-):")
              print("\n".join(bad))
              sys.exit(1)
          PY
